[workspace]
members = ["programs/*"]
exclude = ["spikes"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.89.0"

[profile.release]
# opt-level z: the deployed devnet binary (Upgrade 1) is built this way so it fits the existing ProgramData
# allocation; keep it so `anchor build` reproduces the deployed hash (b54723af…ff58).
opt-level = "z"
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
