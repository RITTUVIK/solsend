# SolSend secret-scan config (gitleaks v8). Extends the default ruleset.
title = "SolSend gitleaks config"

[extend]
useDefault = true

[[rules]]
id = "solana-keypair-json"
description = "Solana keypair file contents (64-byte JSON array)"
regex = '''\[\s*(?:\d{1,3}\s*,\s*){63}\d{1,3}\s*\]'''

[[rules]]
id = "quicknode-tokenized-endpoint"
description = "QuickNode endpoint URL with embedded auth token"
regex = '''https?://[a-z0-9-]+\.[a-z0-9-]+\.quiknode\.pro/[A-Za-z0-9]{16,}'''
keywords = ["quiknode"]

[[rules]]
id = "bridge-api-key-assignment"
description = "Bridge API key assigned in code/config"
regex = '''(?i)bridge[_-]?api[_-]?key\s*[:=]\s*['"]?[A-Za-z0-9_\-]{20,}'''
keywords = ["bridge"]

[[rules]]
id = "privy-app-secret-assignment"
description = "Privy app secret assigned in code/config"
regex = '''(?i)privy[_-]?app[_-]?secret\s*[:=]\s*['"]?[A-Za-z0-9_\-]{20,}'''
keywords = ["privy"]

[[rules]]
id = "raw-card-pan"
description = "Possible raw card PAN (PCI hard rule 7: never store/log PAN)"
regex = '''\b(?:4\d{3}|5[1-5]\d{2}|2[2-7]\d{2}|3[47]\d{2})[ -]?\d{4}[ -]?\d{4}[ -]?\d{3,4}\b'''

[[allowlists]]
description = "Lockfiles contain integrity hashes, not secrets"
paths = ['''(^|/)pnpm-lock\.yaml$''', '''(^|/)Cargo\.lock$''']

[[allowlists]]
description = "Provider/card-network transaction tokens are UUID identifiers (required evidence), not secrets"
regexTarget = "match"
regexes = [
  '''token"?\s*[:=]\s*"?[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}"?''',
  # Solana PUBLIC addresses (32–44 base58 chars, quoted) in token-account fields. Private keys (~88 chars) never match.
  '''[Tt]oken[A-Za-z_]*"\s*:\s*"[1-9A-HJ-NP-Za-km-z]{32,44}"''',
  # SHA-256 authorization hashes emitted publicly onchain (CardSettled/CardRefunded), ONLY under these field names.
  '''auth_?[Hh]ash"\s*:\s*"[0-9a-f]{64}"''',
]
